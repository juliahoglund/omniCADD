name: Build and Push Augustus (Docker Hub)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Docker tag to publish (e.g., bioconda-3x)"
        required: false
        default: "bioconda-3x"
  push:
    paths:
      - "workflow/docker/augustus/**"

env:
  IMAGE_NAME: augustus

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=ref,event=branch
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=augustus
            org.opencontainers.image.source=${{ github.repositoryUrl }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./workflow/docker/augustus
          file: ./workflow/docker/augustus/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
