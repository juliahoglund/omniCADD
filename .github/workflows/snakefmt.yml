name: Snakefmt

on:
  push:
    paths:
      - '**.smk'
      - 'Snakefile'
      - 'snakefile'
      - '.github/workflows/snakefmt.yml'
  pull_request:
    paths:
      - '**.smk'
      - 'Snakefile'
      - 'snakefile'

jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install snakefmt
        run: |
          python -m pip install --upgrade pip
          pip install snakefmt

      - name: Check formatting with snakefmt
        run: |
          echo "Checking Snakefile formatting..."
          snakefmt --check --line-length 130 snakefile
          
          echo ""
          echo "Checking workflow rules formatting..."
          snakefmt --check --line-length 130 workflow/rules/*.smk
          
          echo ""
          echo "✅ All files are properly formatted!"

      - name: Show snakefmt version
        if: always()
        run: snakefmt --version
