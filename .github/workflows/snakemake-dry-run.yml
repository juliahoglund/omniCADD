name: Snakemake Dry Run

on:
  push:
    branches:
      - main
      - master
      - dev
      - restructure
    paths:
      - 'workflow/**/*.smk'
      - 'snakefile'
      - '.tests/config/**'
      - 'workflow/scripts/**'
  pull_request:
    branches:
      - main
      - master
      - dev
      - restructure
    paths:
      - 'workflow/**/*.smk'
      - 'snakefile'
      - '.tests/config/**'
      - 'workflow/scripts/**'

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    name: Python Syntax Validation
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Snakemake (minimal)
        run: |
          pip install snakemake-minimal>=7.21.0
          snakemake --version
      
      - name: Check Python syntax
        run: |
          # Check syntax of Python scripts only (skip placeholder files)
          find workflow/scripts -name "*.py" -type f | while read f; do
            lines=$(wc -l < "$f")
            if [ "$lines" -gt 2 ]; then
              python -m py_compile "$f" || exit 1
            else
              echo "Skipping placeholder file: $f"
            fi
          done
          echo "✓ All Python scripts have valid syntax"
      
      - name: Prepare config files
        run: |
          cp config/config_refs.default.yaml config/config_refs.yaml
          cp config/resources.default.yaml config/resources.yaml
      
      - name: Run dry-run CI tests (both configs)
        run: |
          bash .tests/test_configs.sh
      
      - name: Quick lint check
        run: |
          # Use standard test config for linting
          cp .tests/config/config_standard.yaml config/config.yaml
          snakemake --lint --configfile config/config.yaml
          echo "✓ Snakemake lint check passed"
