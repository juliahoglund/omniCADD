name: Build and Push mafTools (Docker Hub)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Docker tag to publish (e.g., 2026.04.05)"
        required: false
        default: ""
  push:
    paths:
      - "workflow/docker/mafTools/**"

env:
  IMAGE_NAME: maftools

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine tag
        id: determine-tag
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${{ vars.DOCKERHUB_TAG }}"
          fi
          if [ -z "$TAG" ] && [ -f workflow/docker/mafTools/TAG ]; then
            TAG="$(cat workflow/docker/mafTools/TAG | tr -d '[:space:]')"
          fi
          if [ -z "$TAG" ]; then
            TAG="$(date +%Y.%m.%d)"
          fi
          echo "TAG_NAME=$TAG" >> "$GITHUB_ENV"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.TAG_NAME }}
            type=raw,value=latest
            type=ref,event=branch
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=maftools
            org.opencontainers.image.source=${{ github.repositoryUrl }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./workflow/docker/mafTools
          file: ./workflow/docker/mafTools/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
