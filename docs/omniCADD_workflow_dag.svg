<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg id="svg" width="1760" height="1056" viewBox="0 0 1760 1056" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap');
            text { font-family: 'Inter', sans-serif; }
        </style>
        <filter id="sh">
            <feDropShadow dx="1" dy="1" stdDeviation="2" flood-opacity="0.12" />
        </filter>
        <marker id="ab" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0,8 3,0 6" fill="#2E75B6" />
        </marker>
        <marker id="ap" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0,8 3,0 6" fill="#7030A0" />
        </marker>
        <marker id="ag" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0,8 3,0 6" fill="#375623" />
        </marker>
        <marker id="ao" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0,8 3,0 6" fill="#C55A11" />
        </marker>
        <marker id="agy" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0,8 3,0 6" fill="#888" />
        </marker>
        <marker id="aud" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0,8 3,0 6" fill="#9A7200" />
        </marker>
    </defs>

    <!-- Background -->
    <rect x="0" y="0" width="1760" height="1056" fill="white"/>

    <!-- Swimlane Backgrounds -->
    
    <!-- Standard -->
    <rect x="8" y="8" width="1744" height="200" rx="10" fill="#EBF3FB" stroke="#2E75B6" stroke-width="1.5" />
    <rect x="8" y="8" width="70" height="200" rx="8" fill="#2E75B6" />
    <text transform="rotate(-90,43,108)" text-anchor="middle" font-size="10.5" font-weight="700" fill="white">
        <tspan x="43" y="102">Standard Tier</tspan>
        <tspan x="43" y="117">(alignment-based)</tspan>
    </text>

    <!-- Limited -->
    <rect x="8" y="248" width="1744" height="190" rx="10" fill="#F3EBF8" stroke="#7030A0" stroke-width="1.5" />
    <rect x="8" y="248" width="70" height="190" rx="8" fill="#7030A0" />
    <text transform="rotate(-90,43,343)" text-anchor="middle" font-size="10.5" font-weight="700" fill="white">
        <tspan x="43" y="337">Limited Tier</tspan>
        <tspan x="43" y="352">(alignment-free)</tspan>
    </text>

    <!-- Core -->
    <rect x="8" y="478" width="1744" height="190" rx="10" fill="#EBF5EB" stroke="#375623" stroke-width="1.5" />
    <rect x="8" y="478" width="70" height="190" rx="8" fill="#375623" />
    <text transform="rotate(-90,43,573)" text-anchor="middle" font-size="10.5" font-weight="700" fill="white">
        <tspan x="43" y="567">Core Pipeline</tspan>
        <tspan x="43" y="582">(shared steps)</tspan>
    </text>

    <!-- Conservation -->
    <rect x="8" y="708" width="1744" height="120" rx="10" fill="#FEF3E8" stroke="#C55A11" stroke-width="1.5" />
    <rect x="8" y="708" width="70" height="120" rx="8" fill="#C55A11" />
    <text transform="rotate(-90,43,768)" text-anchor="middle" font-size="10.5" font-weight="700" fill="white">
        <tspan x="43" y="762">Conservation</tspan>
        <tspan x="43" y="777">Annotation</tspan>
    </text>

    <!-- Model & Output -->
    <rect x="8" y="868" width="1744" height="180" rx="10" fill="#FFFBE6" stroke="#9A7200" stroke-width="1.5" />
    <rect x="8" y="868" width="70" height="180" rx="8" fill="#9A7200" />
    <text transform="rotate(-90,43,958)" text-anchor="middle" font-size="10.5" font-weight="700" fill="white">
        <tspan x="43" y="952">Model &amp;</tspan>
        <tspan x="43" y="967">Output</tspan>
    </text>

    <!-- Nodes -->
    
    <!-- MAF Alignment Files -->
    <rect x="86" y="82" width="136" height="52" rx="8" fill="#F0F0F0" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3" filter="url(#sh)" />
    <text x="154" y="101" text-anchor="middle" font-size="11" font-weight="600" fill="#444">MAF Alignment</text>
    <text x="154" y="116" text-anchor="middle" font-size="10" fill="#666">Files (input)</text>
    <text x="154" y="129" text-anchor="middle" font-size="8.5" fill="#2E75B6" font-style="italic">source: alignment</text>

    <!-- Clean & Sort MAF -->
    <rect x="258" y="82" width="136" height="52" rx="8" fill="#BDD7EE" stroke="#2E75B6" stroke-width="1.5" filter="url(#sh)" />
    <text x="326" y="101" text-anchor="middle" font-size="11" font-weight="600" fill="#1a3a5c">Clean &amp; Sort MAF</text>
    <text x="326" y="116" text-anchor="middle" font-size="10" fill="#2c5282">ancestral_generation</text>

    <!-- Mark Ancestor -->
    <rect x="432" y="82" width="136" height="52" rx="8" fill="#BDD7EE" stroke="#2E75B6" stroke-width="1.5" filter="url(#sh)" />
    <text x="500" y="101" text-anchor="middle" font-size="11" font-weight="600" fill="#1a3a5c">Mark Ancestor</text>
    <text x="500" y="116" text-anchor="middle" font-size="10" fill="#2c5282">in MAF alignment</text>

    <!-- Extract Ancestor Sequence -->
    <rect x="606" y="82" width="146" height="52" rx="8" fill="#BDD7EE" stroke="#2E75B6" stroke-width="1.5" filter="url(#sh)" />
    <text x="679" y="101" text-anchor="middle" font-size="11" font-weight="600" fill="#1a3a5c">Extract Ancestor</text>
    <text x="679" y="116" text-anchor="middle" font-size="10" fill="#2c5282">Sequence (per chr)</text>

    <!-- Preprocess -->
    <rect x="86" y="317" width="136" height="52" rx="8" fill="#C9A3E5" stroke="#7030A0" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#sh)" />
    <text x="154" y="336" text-anchor="middle" font-size="11" font-weight="600" fill="#3d0070">Preprocess</text>
    <text x="154" y="351" text-anchor="middle" font-size="10" fill="#5a0a9e">Reference Genome</text>
    <text x="154" y="363" text-anchor="middle" font-size="8.5" fill="#7030A0" font-style="italic">optional</text>

    <!-- Gene Prediction -->
    <rect x="258" y="317" width="136" height="52" rx="8" fill="#C9A3E5" stroke="#7030A0" stroke-width="1.5" filter="url(#sh)" />
    <text x="326" y="336" text-anchor="middle" font-size="11" font-weight="600" fill="#3d0070">Gene Prediction</text>
    <text x="326" y="351" text-anchor="middle" font-size="10" fill="#5a0a9e">(Augustus)</text>
    <text x="326" y="363" text-anchor="middle" font-size="8.5" fill="#7030A0" font-style="italic">source: augustus</text>

    <!-- Reconstruct -->
    <rect x="432" y="317" width="136" height="52" rx="8" fill="#C9A3E5" stroke="#7030A0" stroke-width="1.5" filter="url(#sh)" />
    <text x="500" y="336" text-anchor="middle" font-size="11" font-weight="600" fill="#3d0070">Reconstruct</text>
    <text x="500" y="351" text-anchor="middle" font-size="10" fill="#5a0a9e">Ancestor</text>
    <text x="500" y="363" text-anchor="middle" font-size="8.5" fill="#7030A0" font-style="italic">source: reconstruct</text>

    <!-- GFF / GTF -->
    <rect x="740" y="317" width="136" height="52" rx="8" fill="#F0F0F0" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3" filter="url(#sh)" />
    <text x="808" y="336" text-anchor="middle" font-size="11" font-weight="600" fill="#444">GFF / GTF</text>
    <text x="808" y="351" text-anchor="middle" font-size="10" fill="#555">Annotation Files</text>
    <text x="808" y="363" text-anchor="middle" font-size="8.5" fill="#2E75B6" font-style="italic">source: gff / gtf</text>

    <!-- Population VCF -->
    <rect x="86" y="547" width="136" height="52" rx="8" fill="#F0F0F0" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3" filter="url(#sh)" />
    <text x="154" y="566" text-anchor="middle" font-size="11" font-weight="600" fill="#444">Population VCF</text>
    <text x="154" y="581" text-anchor="middle" font-size="10" fill="#666">(per chromosome)</text>
    <text x="154" y="593" text-anchor="middle" font-size="8.5" fill="#777" font-style="italic">input</text>

    <!-- Frequency Files -->
    <rect x="258" y="547" width="136" height="52" rx="8" fill="#C6EFCE" stroke="#375623" stroke-width="1.5" filter="url(#sh)" />
    <text x="326" y="566" text-anchor="middle" font-size="11" font-weight="600" fill="#1e3e10">Frequency Files</text>
    <text x="326" y="581" text-anchor="middle" font-size="10" fill="#375623">freq_files rule</text>

    <!-- Derive Variants -->
    <rect x="432" y="547" width="136" height="52" rx="8" fill="#C6EFCE" stroke="#375623" stroke-width="1.5" filter="url(#sh)" />
    <text x="500" y="566" text-anchor="middle" font-size="11" font-weight="600" fill="#1e3e10">Derive Variants</text>
    <text x="500" y="581" text-anchor="middle" font-size="10" fill="#375623">frequency-based</text>

    <!-- Simulate Variants -->
    <rect x="606" y="547" width="136" height="52" rx="8" fill="#C6EFCE" stroke="#375623" stroke-width="1.5" filter="url(#sh)" />
    <text x="674" y="566" text-anchor="middle" font-size="11" font-weight="600" fill="#1e3e10">Simulate Variants</text>
    <text x="674" y="581" text-anchor="middle" font-size="10" fill="#375623">GTR model</text>

    <!-- Summary Report -->
    <rect x="780" y="547" width="132" height="52" rx="8" fill="#C6EFCE" stroke="#375623" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#sh)" />
    <text x="846" y="566" text-anchor="middle" font-size="11" font-weight="600" fill="#1e3e10">Summary Report</text>
    <text x="846" y="581" text-anchor="middle" font-size="10" fill="#375623">QC / stats</text>
    <text x="846" y="593" text-anchor="middle" font-size="8.5" fill="#555" font-style="italic">optional</text>

    <!-- VEP Annotation -->
    <rect x="960" y="540" width="136" height="48" rx="8" fill="#BDD7EE" stroke="#2E75B6" stroke-width="1.5" filter="url(#sh)" />
    <text x="1028" y="559" text-anchor="middle" font-size="11" font-weight="600" fill="#1a3a5c">VEP Annotation</text>
    <text x="1028" y="575" text-anchor="middle" font-size="9.5" fill="#2c5282">variant_annotator: vep</text>

    <!-- SNPEff Annotation -->
    <rect x="960" y="598" width="136" height="48" rx="8" fill="#C9A3E5" stroke="#7030A0" stroke-width="1.5" filter="url(#sh)" />
    <text x="1028" y="617" text-anchor="middle" font-size="11" font-weight="600" fill="#3d0070">SNPEff Annotation</text>
    <text x="1028" y="633" text-anchor="middle" font-size="9.5" fill="#5a0a9e">variant_annotator: snpeff</text>

    <!-- Combine Annotations -->
    <rect x="1148" y="547" width="136" height="52" rx="8" fill="#C6EFCE" stroke="#375623" stroke-width="1.5" filter="url(#sh)" />
    <text x="1216" y="566" text-anchor="middle" font-size="11" font-weight="600" fill="#1e3e10">Combine</text>
    <text x="1216" y="581" text-anchor="middle" font-size="10" fill="#375623">Annotations</text>

    <!-- GERP -->
    <rect x="780" y="744" width="120" height="48" rx="8" fill="#FCE4D6" stroke="#C55A11" stroke-width="1.5" filter="url(#sh)" />
    <text x="840" y="763" text-anchor="middle" font-size="11" font-weight="600" fill="#6b2d00">GERP</text>
    <text x="840" y="779" text-anchor="middle" font-size="9.5" fill="#9b3c00">gerp.enabled: true</text>

    <!-- phastCons -->
    <rect x="920" y="744" width="128" height="48" rx="8" fill="#FCE4D6" stroke="#C55A11" stroke-width="1.5" filter="url(#sh)" />
    <text x="984" y="763" text-anchor="middle" font-size="11" font-weight="600" fill="#6b2d00">phastCons</text>
    <text x="984" y="779" text-anchor="middle" font-size="9.5" fill="#9b3c00">phast.phastCons: true</text>

    <!-- phyloP -->
    <rect x="1062" y="744" width="120" height="48" rx="8" fill="#FCE4D6" stroke="#C55A11" stroke-width="1.5" filter="url(#sh)" />
    <text x="1122" y="763" text-anchor="middle" font-size="11" font-weight="600" fill="#6b2d00">phyloP</text>
    <text x="1122" y="779" text-anchor="middle" font-size="9.5" fill="#9b3c00">phast.phyloP: true</text>

    <!-- SIFT (disabled) -->
    <rect x="1202" y="744" width="120" height="48" rx="8" fill="#E8E8E8" stroke="#aaa" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.6" />
    <text x="1262" y="763" text-anchor="middle" font-size="11" font-weight="600" fill="#777">SIFT</text>
    <text x="1262" y="779" text-anchor="middle" font-size="9.5" fill="#999">sift.enabled: false</text>

    <!-- Impute & Prepare Data -->
    <rect x="86" y="922" width="140" height="52" rx="8" fill="#FFEB9C" stroke="#9A7200" stroke-width="1.5" filter="url(#sh)" />
    <text x="156" y="941" text-anchor="middle" font-size="11" font-weight="600" fill="#5a4200">Impute &amp; Prepare</text>
    <text x="156" y="956" text-anchor="middle" font-size="10" fill="#7a5900">Data (→ .npz files)</text>

    <!-- Train & Test Model -->
    <rect x="270" y="922" width="140" height="52" rx="8" fill="#FFEB9C" stroke="#9A7200" stroke-width="1.5" filter="url(#sh)" />
    <text x="340" y="941" text-anchor="middle" font-size="11" font-weight="600" fill="#5a4200">Train &amp; Test</text>
    <text x="340" y="956" text-anchor="middle" font-size="10" fill="#7a5900">Model</text>

    <!-- Generate All Substitutions -->
    <rect x="460" y="922" width="140" height="52" rx="8" fill="#FFEB9C" stroke="#9A7200" stroke-width="1.5" filter="url(#sh)" />
    <text x="530" y="941" text-anchor="middle" font-size="11" font-weight="600" fill="#5a4200">Generate All</text>
    <text x="530" y="956" text-anchor="middle" font-size="10" fill="#7a5900">Substitutions</text>

    <!-- Score Variants -->
    <rect x="650" y="922" width="140" height="52" rx="8" fill="#FFEB9C" stroke="#9A7200" stroke-width="1.5" filter="url(#sh)" />
    <text x="720" y="941" text-anchor="middle" font-size="11" font-weight="600" fill="#5a4200">Score Variants</text>
    <text x="720" y="956" text-anchor="middle" font-size="10" fill="#7a5900">apply model</text>

    <!-- CADD Scores (FINAL OUTPUT) -->
    <rect x="842" y="915" width="150" height="66" rx="12" fill="#FFD700" stroke="#9A7200" stroke-width="2.5" filter="url(#sh)" />
    <text x="917" y="937" text-anchor="middle" font-size="12" font-weight="700" fill="#4a3000">Genome-wide</text>
    <text x="917" y="953" text-anchor="middle" font-size="12" font-weight="700" fill="#4a3000">CADD Scores</text>
    <text x="917" y="973" text-anchor="middle" font-size="15">★</text>

    <!-- Arrows -->
    
    <!-- Standard tier arrows -->
    <path d="M222,108 L258,108" stroke="#2E75B6" stroke-width="1.8" fill="none" marker-end="url(#ab)" />
    <path d="M394,108 L432,108" stroke="#2E75B6" stroke-width="1.8" fill="none" marker-end="url(#ab)" />
    <path d="M568,108 L606,108" stroke="#2E75B6" stroke-width="1.8" fill="none" marker-end="url(#ab)" />
    <path d="M752,108 L1748,108 L1748,660 L500,660 L500,599" stroke="#2E75B6" stroke-width="1.8" fill="none" stroke-dasharray="7,4" marker-end="url(#ab)" />

    <!-- Limited tier arrows -->
    <path d="M222,343 L258,343" stroke="#7030A0" stroke-width="1.8" fill="none" marker-end="url(#ap)" />
    <path d="M394,343 L432,343" stroke="#7030A0" stroke-width="1.8" fill="none" marker-end="url(#ap)" />
    <path d="M500,369 L500,458 L500,547" stroke="#7030A0" stroke-width="1.8" fill="none" stroke-dasharray="7,4" marker-end="url(#ap)" />
    <path d="M394,343 L394,240 L1700,240 L1700,622 L1096,622" stroke="#7030A0" stroke-width="1.5" fill="none" stroke-dasharray="6,4" opacity="0.85" marker-end="url(#ap)" />
    <path d="M808,369 L808,458 L808,540 L960,540" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="5,4" opacity="0.9" marker-end="url(#agy)" />

    <!-- Core pipeline arrows -->
    <path d="M222,573 L258,573" stroke="#375623" stroke-width="1.8" fill="none" marker-end="url(#ag)" />
    <path d="M394,573 L432,573" stroke="#375623" stroke-width="1.8" fill="none" marker-end="url(#ag)" />
    <path d="M568,573 L606,573" stroke="#375623" stroke-width="1.8" fill="none" marker-end="url(#ag)" />
    <path d="M742,573 L780,573" stroke="#375623" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#ag)" opacity="0.7" />
    <path d="M742,547 Q846,520 912,540 L960,564" stroke="#375623" stroke-width="1.6" fill="none" marker-end="url(#ag)" />
    <path d="M742,599 Q846,626 912,606 L960,615" stroke="#375623" stroke-width="1.6" fill="none" marker-end="url(#ag)" />
    <path d="M1096,564 Q1122,564 1148,564" stroke="#2E75B6" stroke-width="1.8" fill="none" marker-end="url(#ab)" />
    <path d="M1096,622 Q1122,604 1148,588" stroke="#7030A0" stroke-width="1.6" fill="none" marker-end="url(#ap)" />

    <!-- Conservation arrows -->
    <path d="M840,744 L840,693 L1210,693 L1210,599" stroke="#C55A11" stroke-width="1.5" fill="none" marker-end="url(#ao)" />
    <path d="M984,744 L984,693 L1216,693 L1216,599" stroke="#C55A11" stroke-width="1.5" fill="none" marker-end="url(#ao)" />
    <path d="M1122,744 L1122,693 L1222,693 L1222,599" stroke="#C55A11" stroke-width="1.5" fill="none" marker-end="url(#ao)" />

    <!-- Model & Output arrows -->
    <path d="M1284,565 L1360,565 L1360,848 L156,848 L156,922" stroke="#9A7200" stroke-width="1.8" fill="none" stroke-dasharray="7,4" marker-end="url(#aud)" />
    <path d="M1284,581 L1360,581 L1360,843 L530,843 L530,922" stroke="#9A7200" stroke-width="1.6" fill="none" stroke-dasharray="6,4" opacity="0.85" marker-end="url(#aud)" />
    <path d="M226,948 L270,948" stroke="#9A7200" stroke-width="1.8" fill="none" marker-end="url(#aud)" />
    <path d="M410,948 Q465,985 530,985 Q595,985 650,948" stroke="#9A7200" stroke-width="1.6" fill="none" marker-end="url(#aud)" />
    <path d="M600,948 L650,948" stroke="#9A7200" stroke-width="1.8" fill="none" marker-end="url(#aud)" />
    <path d="M790,948 L842,948" stroke="#9A7200" stroke-width="2" fill="none" marker-end="url(#aud)" />
</svg>
