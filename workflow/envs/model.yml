name: model
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # Python environment
  - python=3.9
  - pip
  - setuptools
  - wheel
  
  # System libraries
  - bzip2
  - ca-certificates
  - certifi
  - libffi
  - libzlib
  - ncurses
  - openssl
  - readline
  - tk
  - xz
  - zstd
  
  # Archive handling
  - libarchive
  - lz4-c
  - lzo
  
  # pip packages for machine learning
  - pip:
      - joblib
      - numpy>=1.26
      - pandas>=2.2
      - scikit-learn>=1.4
      - scipy>=1.13
      - threadpoolctl