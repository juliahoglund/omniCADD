name: alignment
channels:
  - bioconda
  - conda-forge
  - defaults
dependencies:
  # Core tools for alignment generation
  - minimap2
  - samtools
  - htsbox
  - biopython
  - python=3.10
  - pip
  - setuptools
  - wheel
  # For split_fasta_by_chromosome.py and general scripting
  - numpy
  # For compatibility with other rules
  - bcftools
  - gzip
  - pigz
  - zlib
