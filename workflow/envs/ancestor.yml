name: ancestor
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # Python environment
  - python=3.10
  - pip
  - setuptools
  - wheel
  
  # Core bioinformatics tools
  - biopython>=1.80
  - msaconverter
  - numpy
  
  # System libraries
  - bzip2
  - ca-certificates
  - certifi
  - libffi
  - libzlib
  - ncurses
  - openssl
  - readline
  - tk
  - xz
  - zstd
  
  # Archive and compression
  - libarchive
  - lz4-c
  - lzo
  
  # pip packages
  - pip:
      - bio>=1.6.0
      - biothings-client
      - gprofiler-official
      - lz4
      - mygene
      - pandas>=2.1
      - pyfaidx
      - sh