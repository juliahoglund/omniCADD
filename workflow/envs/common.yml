name: common
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # Python environment
  - python=3.10
  - pip
  - setuptools
  - wheel
  
  # Bioinformatics tools
  - bcftools
  - vcftools
  - gsl
  - htslib
  - perl
  
  # System libraries
  - bzip2
  - ca-certificates
  - certifi
  - libffi
  - libzlib
  - ncurses
  - openssl
  - readline
  - tk
  - xz
  - zstd
  
  # Archive handling
  - libarchive
  - lz4-c
  - lzo
  
  # pip packages
  - pip:
      - pysam>=0.22