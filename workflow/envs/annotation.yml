name: annotation
channels:
  - conda-forge
  - bioconda
  - defaults
  - pytorch
dependencies:
  # Python environment
  - python=3.10
  - pip
  - setuptools
  - wheel
  
  # Core bioinformatics tools
  - bedops
  - ensembl-vep=112
  - perl-list-moreutils
  - gffread
  - htslib
  - phast
  - gerp
  - samtools
  - seqtk
  - sift4g
  
  # Scientific computing
  - numpy
  
  # System libraries and utilities
  - bzip2
  - ca-certificates
  - certifi
  - openssl
  - ncurses
  - tk
  - xz
  - zstd
  - lz4-c  # provides the `lz4` CLI, for decompressing .maf.lz4 alignment chunks
  
  # Jupyter and notebook support
  - jupyter_core
  - nbformat
  - jinja2
  - markupsafe
  
  # pip packages
  - pip:
      - biopython>=1.83
      - bioutils
      - bx
      - cialign
      - configargparse
      - matplotlib
      - pandas>=2.2
      - pysam>=0.22
      - scipy