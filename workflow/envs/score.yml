name: score
channels:
  - conda-forge
  - bioconda
  - defaults
  - pytorch
dependencies:
  # Python environment
  - python=3.10
  - pip
  - setuptools
  - wheel
  
  # Bioinformatics tools
  - bcftools
  - bedtools
  - gatk=3.6
  - htslib
  - samtools
  - scikit-learn
  - joblib
  - threadpoolctl
  
  # Java for GATK
  - java-jdk=8
  
  # Scientific computing
  - gsl
  
  # System libraries
  - bzip2
  - ca-certificates
  - certifi
  - curl
  - libffi
  - libzlib
  - ncurses
  - openssl
  - perl
  - readline
  - tk
  - xz
  - zstd
  
  # Archive handling
  - libarchive
  - lz4-c
  - lzo
  
  # pip packages
  - pip:
      - biopython>=1.84
      - numpy>=2.1
      - pandas>=2.2
      - scipy>=1.14