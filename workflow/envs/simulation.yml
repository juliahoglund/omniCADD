name: simulation
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # Python environment
  - python=3.10
  - pip
  - setuptools
  - wheel
  
  # Core system libraries
  - bzip2
  - ca-certificates
  - certifi
  - libffi
  - libzlib
  - ncurses
  - openssl
  - readline
  - tk
  - xz
  - zstd
  
  # Essential utilities
  - packaging
  - platformdirs
  - tqdm
  - colorama
  
  # Network and requests
  - requests
  - urllib3
  - cffi
  - pycparser
  - charset-normalizer
  - idna
  - pysocks
  
  # Archive handling
  - libarchive
  - lz4-c
  - lzo
  
  # XML processing
  - libxml2
  - libiconv
  
  # pip packages (keep major versions for critical packages)
  - pip:
      - natsort>=8.0
      - numpy>=1.20
      - pysam>=0.20