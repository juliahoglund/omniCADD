# Based on example in https://github.com/Snakemake-Profiles/slurm/blob/master/%7B%7Bcookiecutter.profile_name%7D%7D/config.yaml

# Default command line arguments:
cores: 8
use-conda: True
use-singularity: True
singularity-args: "--cleanenv --bind /tmp"
restart-times: 2
max-jobs-per-second: 1
max-status-checks-per-second: 10
local-cores: 1
latency-wait: 60

# Cluster-specific conda configuration
# On UPPMAX clusters, use system conda prefix for better performance
conda-prefix: "/home/juliaha/.conda/envs"  # Update this to your actual conda prefix