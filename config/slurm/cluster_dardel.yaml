# Dardel cluster resource configuration
# Optimized for PDC Dardel specifications (AMD EPYC 7742, 256GB RAM per node)

__default__:
  account: # fill in your PDC compute account (e.g., sllstore2022-XX-X)
  partition: main
  time: "05:00:00"
  ntasks: 1
  cpus-per-task: 1
  mem: "4G"

# High-resource rules for alignment processing (mafTools containers)
# Dardel has 128 cores per node, so we can use more resources
"maf_df|maf_ro|maf_str|maf_sorter":
  time: "08:00:00"
  cpus-per-task: 8
  mem: "16G"

# Annotation rules - memory intensive
# VEP benefits from more memory on Dardel  
"compute_gerp|compute_gerpelem|run_vep":
  time: "12:00:00"
  cpus-per-task: 8
  mem: "24G"

# Model training - highest resource requirements
# Take advantage of Dardel's high memory per node
"train_model":
  time: "24:00:00"
  cpus-per-task: 24
  mem: "96G"

# Scoring rules - parallel processing
"score_variants":
  time: "08:00:00"
  cpus-per-task: 16
  mem: "32G"

# I/O intensive rules
"combine_annotations":
  time: "04:00:00"
  cpus-per-task: 4
  mem: "16G"
  
# Report generation
"generate_report":
  time: "02:00:00"
  cpus-per-task: 2
  mem: "8G"
