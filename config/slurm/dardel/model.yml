# Model environment optimized for PDC Dardel
# Uses Intel-optimized packages where available
name: model_dardel
channels:
  - conda-forge
  - intel
  - defaults
dependencies:
  - python=3.11
  - numpy=1.24
  - scipy=1.11
  - scikit-learn=1.3
  - pandas=2.1
  - matplotlib=3.7
  - joblib=1.3
  - threadpoolctl=3.2
