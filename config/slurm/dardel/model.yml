# Model environment optimized for PDC Dardel
# Uses Intel-optimized packages where available
name: model_dardel
channels:
  - conda-forge
  - intel
  - bioconda
  - defaults
dependencies:
  # Python environment
  - python=3.11
  - pip
  - setuptools
  - wheel
  
  # Machine learning (Intel optimized)
  - numpy=1.24
  - scipy=1.11
  - scikit-learn=1.3
  - pandas=2.1
  - matplotlib=3.7
  - joblib=1.3
  - threadpoolctl=3.2
  
  # System libraries
  - bzip2
  - ca-certificates
  - certifi
  - libffi
  - libzlib
  - ncurses
  - openssl
  - readline
  - tk
  - xz
  - zstd
  
  # Archive handling
  - libarchive
  - lz4-c
  - lzo
