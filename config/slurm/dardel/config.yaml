# Snakemake SLURM profile for PDC Dardel
# Requires Snakemake 8+ and snakemake-executor-plugin-slurm
#
# USAGE (from a screen/tmux session on a login node):
#   module load PDC bioinfo-tools apptainer
#   conda activate omnicadd
#   snakemake --profile config/slurm/dardel -n   # dry-run
#   snakemake --profile config/slurm/dardel       # full run

# Profile and SLURM executor settings
executor: slurm
jobs: 50  # Max simultaneous jobs - reduced to be more considerate on shared cluster
cores: 8
use-conda: True
use-apptainer: true
apptainer-args: "--bind /sw,/cfs/klemming"
apptainer-prefix: "/cfs/klemming/projects/supr/sllstore2017093/julia_omniCADD/singularity-cache"
restart-times: 2
max-jobs-per-second: 1
max-status-checks-per-second: 10
local-cores: 1
latency-wait: 60
keep-going: True
rerun-incomplete: True
rerun-triggers:
  - input  # Only rerun if input files actually changed, not just mtime

# Ensure resources are passed to SLURM
retries: 2

default-resources:
  slurm_account: "naiss2026-1-30"
  slurm_partition: "shared"
  slurm_job_name: "{rule}_{wildcards}"
  mem_mb: 8192
  tasks: 1
  slurm_extra: "'--output=slurm/slurm_%x_%j.out --error=slurm/slurm_%x_%j.err'"

# Map runtime to SLURM time format  
default-storage-provider: none

# Conda and Apptainer paths
conda-prefix: "/cfs/klemming/projects/supr/sllstore2017093/julia_omniCADD/conda-envs"

# Per-rule overrides — memory only (time is set in resources.yaml)
# Only rules with values different from the defaults above are listed
set-resources:
  # Step 1: Ancestral sequence
  # maf_ro, maf_df, mark_ancestor, clean_ambiguous share "maf_part_group" below,
  # so their `time` is pinned to the group's max requirement (maf_ro's 12h)
  maf_ro:
    mem_mb: 49152
    time: "12:00:00"
  maf_df:
    mem_mb: 32768
    time: "12:00:00"
  mark_ancestor:
    mem_mb: 24576
    time: "12:00:00"
  clean_ambiguous:
    time: "12:00:00"
  reconstruct_ancestor:
    mem_mb: 49152
  fit_phylo_model:
    mem_mb: 32768
  maf_str:
    mem_mb: 4096
  # OOM'd on chr1 (largest chromosome, 44 species kept) at both 32768 and
  # 65536; observed peak of ~77.8GB at 131072. Sized down to this level with
  # ~25% headroom over the observed peak now that we have a real number.
  maf_sorter:
    mem_mb: 98304

  # Step 2: Derive variants
  freq_files:
    mem_mb: 16384  # 16GB - increased for large chromosomes
  gen_derived:
    mem_mb: 16384

  # Step 3: Simulate variants
  simulate_indels:
    mem_mb: 32768

  # Step 4: Summary report
  create_stats_report:
    mem_mb: 49152
  create_summary:
    mem_mb: 32768

  # Step 5: Annotate variants
  run_vep_combine:
    mem_mb: 49152
  process_vep_combine:
    mem_mb: 32768
  run_snpeff:
    mem_mb: 49152
    time: "12:00:00"
  process_snpeff_derived:
    mem_mb: 32768
    time: "12:00:00"
  process_snpeff_simulated:
    mem_mb: 32768
    time: "12:00:00"
  gerp2coords:
    time: "12:00:00"
  wig2bed:
    time: "12:00:00"
  run_vep:
    time: "12:00:00"
  process_vep:
    time: "12:00:00"
  merge_vep_snpeff:
    time: "12:00:00"
  augustus_predict_genes:
    mem_mb: 32768
  compute_gerp:
    mem_mb: 32768
  split_alignment:
    mem_mb: 16384
  phylo_fit:
    mem_mb: 32768

  # Step 6: Combine annotations
  combine_annotations_combine:
    mem_mb: 65536
  combine_annotations_snpeff_combine:
    mem_mb: 65536

  # Step 7: Train & test model
  train_test_model:
    mem_mb: 98304

  # Step 8: Score variants
  run_genome_vep:
    mem_mb: 49152
    time: "16:00:00"
  process_genome_vep:
    mem_mb: 49152
    time: "16:00:00"
  run_genome_snpeff:
    mem_mb: 49152
    time: "16:00:00"
  process_genome_snpeff:
    mem_mb: 49152
    time: "16:00:00"
  intersect_genomewide:
    time: "16:00:00"
  prepare_whole_genome:
    mem_mb: 65536
    time: "16:00:00"
  score_variants:
    mem_mb: 98304
  sort_raw_scores:
    mem_mb: 49152

  # Alignment generation
  align_species:
    mem_mb: 49152
  filter_alignments:
    mem_mb: 32768
    time: "08:00:00"
  sort_bam:
    mem_mb: 32768
    time: "08:00:00"
  generate_consensus:
    time: "08:00:00"

# job group assignments for better scheduling and resource allocation
groups:
  # Step 1: Alignment & Ancestral
  filter_alignments: "species_align_group"
  sort_bam: "species_align_group"
  generate_consensus: "species_align_group"
  format_for_gerp: "multiway_group"
  clean_ambiguous: "maf_part_group"
  mark_ancestor: "maf_part_group"
  maf_df: "maf_part_group"
  maf_ro: "maf_part_group"
  # maf_str and maf_sorter are split into separate groups (rather than one
  # shared maf_chr_group) because they have very different memory profiles
  # (~16GB vs ~32GB/item) - bundling them together would force maf_str's
  # batch size down to match maf_sorter's tighter memory ceiling.
  maf_str: "maf_str_group"
  maf_sorter: "maf_sorter_group"

  # Step 2: Variant Derivation
  freq_files: "variant_derive_group"
  gen_derived: "variant_derive_group"
  snp_filter: "variant_derive_group"

  # Step 3: Variant Simulation
  create_parameters: "sim_param_group"
  simulate_snps: "sim_exec_group"
  filter_variants: "sim_exec_group"
  split_by_chrom: "sim_split_group"

  # Step 4: Summary Report
  summary_report_with_gene_prediction: "summary_per_chr_group"

  # Step 5 & 6: Standard Annotation Processing
  format_alignment: "pre_gerp_group"
  convert_alignment: "pre_gerp_group"
  prune_columns: "pre_gerp_group"
  gerp2coords: "post_gerp_group"
  wig2bed: "post_gerp_group"
  combine_constraint: "constraint_merge_group"
  run_vep: "post_gerp_group"
  process_vep: "post_gerp_group"
  run_snpeff: "post_gerp_group"
  process_snpeff_derived: "post_gerp_group"
  process_snpeff_simulated: "post_gerp_group"
  merge_vep_snpeff: "post_gerp_group"

  # SnpEff Database Helpers
  snpeff_extract_normalized_chr: "snpeff_prep_group"
  snpeff_generate_sequences: "snpeff_prep_group"
  snpeff_validate_prep: "snpeff_prep_group"

  # Step 8: Whole Genome Scoring
  run_genome_vep: "genome_prep_shard_group"
  process_genome_vep: "genome_prep_shard_group"
  run_genome_snpeff: "genome_prep_shard_group"
  process_genome_snpeff: "genome_prep_shard_group"
  intersect_genomewide: "genome_prep_shard_group"
  prepare_whole_genome: "genome_prep_shard_group"
  count_positions: "genome_post_index_group"
  format_cadd_scores: "genome_post_index_group"
  index_cadd_scores: "genome_post_index_group"

# bundle sized per group
group-components:
  pre_gerp_group: 5  # 3 rules x ~1h = ~3h/item -> 15h at 5
  post_gerp_group: 1  # 8 rules x 12h = ~96h/item -> can't bundle more than 1 item
  filter_group: 10
  species_align_group: 5  # 3 rules x 8h = 24h/item -> 120h at 5
  multiway_group: 25
  maf_part_group: 2  # 4 rules x 12h = 48h/item -> 96h at 2
  maf_str_group: 25  # mem_mb=4096/item -> 100GB at 25; time 4h/item -> 100h at 25
  maf_sorter_group: 1  # mem_mb=65536/item -> bundling more than 1 gets too close to the 231GB node cap
  variant_derive_group: 5
  sim_param_group: 20
  sim_exec_group: 5
  sim_split_group: 10
  summary_per_chr_group: 10
  constraint_merge_group: 15
  snpeff_prep_group: 10  # 3 rules x ~4h = ~12h/item -> 120h at 10 (was 15 -> 180h, over the cap)
  genome_prep_shard_group: 1  # 6 rules x 16h = 96h/item -> can't bundle more than 1 item
  genome_post_index_group: 10  # 3 rules x ~4h = ~12h/item -> 120h at 10 (was 15 -> 180h, over the cap)

