# R statistics environment optimized for PDC Dardel
# Uses Intel MKL optimized R packages where available
name: r_stats_dardel
channels:
  - conda-forge
  - bioconda
  - intel
  - r
  - defaults
dependencies:
  # R environment (Intel optimized)
  - r-base=4.3
  - r-essentials
  
  # Core R packages for data manipulation and visualization
  - r-ggplot2=3.4
  - r-dplyr=1.1
  - r-tidyr=1.3
  - r-readr=2.1
  - r-stringr=1.5
  - r-forcats=1.0
  - r-purrr=1.0
  - r-tibble=3.2
  
  # Statistical and modeling packages (Intel MKL optimized)
  - r-mass=7.3
  - r-mgcv=1.8
  - r-nlme=3.1
  - r-survival=3.5
  - r-cluster=2.1
  - r-lattice=0.21
  - r-matrix=1.6
  - r-boot=1.3
  - r-class=7.3
  - r-codetools=0.2
  - r-foreign=0.8
  - r-kernsmooth=2.23
  - r-nnet=7.3
  - r-rpart=4.1
  - r-spatial=7.3
  
  # Documentation and reporting
  - r-rmarkdown=2.25
  - r-knitr=1.44
  - r-markdown=1.8
  - r-yaml=2.3
  - r-htmltools=0.5
  - r-evaluate=0.22
  - r-highr=0.10
  - r-xfun=0.40
  - r-tinytex=0.47
  
  # Graphics and plotting
  - r-scales=1.2
  - r-gtable=0.3
  - r-munsell=0.5
  - r-colorspace=2.1
  - r-rcolorbrewer=1.1
  - r-viridislite=0.4
  - r-farver=2.1
  - r-labeling=0.4
  - r-isoband=0.2
  
  # Utilities
  - r-magrittr=2.0
  - r-rlang=1.1
  - r-glue=1.6
  - r-cli=3.6
  - r-crayon=1.5
  - r-fansi=1.0
  - r-utf8=1.2
  - r-pillar=1.9
  - r-pkgconfig=2.0
  - r-lifecycle=1.0
  - r-vctrs=0.6
  - r-ellipsis=0.3
  - r-backports=1.4
  - r-digest=0.6
  - r-mime=0.12
  - r-jsonlite=1.8
  - r-base64enc=0.1
  - r-htmlwidgets=1.6
  
  # Development and parsing
  - r-rstudioapi=0.15
  - r-remotes=2.4
  - r-withr=2.5
  - r-processx=3.8
  - r-callr=3.7
  - r-ps=1.7
  - r-assertthat=0.2
  - r-cpp11=0.4
  
  # Bioinformatics tools
  - bedtools=2.31
  - samtools=1.18
  - bcftools=1.18
  - htslib=1.18
  
  # System tools
  - gzip
  - grep
  - gawk
  
  # Python for mixed workflows
  - python=3.11
  - pip
  
  # System libraries
  - bzip2
  - ca-certificates
  - certifi
  - libffi
  - libzlib
  - ncurses
  - openssl
  - readline
  - tk
  - xz
  - zstd
  
  # Intel optimized libraries for numerical computing
  - mkl
  - mkl-service
  - intel-openmp