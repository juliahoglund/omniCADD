__default__:
  account: # fill in your compute account on your HPC system (if applicable)
  partition: core
  time: "05:00:00"
  ntasks: 1
  cpus-per-task: 1

# High-resource rules for alignment processing (mafTools containers)
"maf_df|maf_ro|maf_str|maf_sorter":
  time: "08:00:00"
  cpus-per-task: 6
  mem: "8G"

# Annotation rules - memory intensive  
"compute_gerp|compute_gerpelem":
  time: "12:00:00"
  cpus-per-task: 8
  mem: "16G"

# VEP annotation
"run_vep":
  time: "06:00:00"
  cpus-per-task: 4
  mem: "8G"

# Model training - highest resource requirements
"train_model":
  time: "24:00:00"
  cpus-per-task: 16
  mem: "64G"

# Scoring variants
"score_variants":
  time: "12:00:00"
  cpus-per-task: 8
  mem: "32G"

# Chromosome sorting - long running
"sort_by_chr":
  time: "10:00:00"
  cpus-per-task: 4
  mem: "4G"