# Test overlay config: overrides for local minimal integration testing

data_tier: "custom"

chromosomes:
  karyotype: [ '2', '18' ]
  train: [ '2' ]
  score: [ '18' ]

# Override references to test assets under .tests
generate_variants:
  reference_genome_wildcard: ".tests/genome/Wild_Boar_chr{chr}.fa"

gene_annotation:
  source: "gff"
  predict_genes: false
  gff: ".tests/annotation/minimal_wild_boar.gff"

annotation:
  variant_annotator: "snpeff"
  snpeff:
    enabled: true
    database:
      name: "wild_boar_custom"
      path: ".tests/snpEff/data/"
    build:
      config_file: ".tests/snpEff/snpEff.config"
    run:
      options: "-v -noStats"
  grantham_matrix: ".tests/grantham/grantham_matrix.tsv"

stats_report:
  enabled: false
