# Test overlay with Augustus gene prediction + SNPEff on Dardel

data_tier: "custom"

chromosomes:
  karyotype: [ '2', '18' ]
  train: [ '2' ]
  score: [ '18' ]

# Use repository test genomes
generate_variants:
  reference_genome_wildcard: ".tests/genome/Wild_Boar_chr{chr}.fa"

gene_annotation:
  source: "augustus"
  predict_genes: true
  augustus:
    species: "generic"  # override to "human" or "sus_scrofa" if available
    hints: null
    options: "--strand=both --UTR=on --gff3=on"

# Container images used by specific rules
# IMPORTANT: Use Quay.io Biocontainers tags (Docker Hub often misses tags)
# Find tags: conda search -c bioconda augustus (map version/build to tag)
# Verify:    apptainer exec docker://quay.io/biocontainers/augustus:<tag> augustus --version
containers:
  # Example known-good pattern (update to a valid available tag on your system):
  # augustus: "docker://quay.io/biocontainers/augustus:3.5.0--pl5321h9f8466b_5"
  # Set an explicit tag you have validated to avoid pull failures.
  augustus: "docker://quay.io/biocontainers/augustus:3.5.0--pl5321h9f8466b_5"

annotation:
  variant_annotator: "snpeff"
  snpeff:
    enabled: true
    database:
      name: "wild_boar_custom"
      path: ".tests/snpEff/data/"
    build:
      config_file: ".tests/snpEff/snpEff.config"
      annotation_format: "gff3"
    run:
      options: "-v -noStats"
  grantham_matrix: ".tests/grantham/grantham_matrix.tsv"

stats_report:
  enabled: false

ancestral_sequence:
  source: "none"
