# Test overlay with Augustus gene prediction + SNPEff on Dardel

data_tier: "custom"

chromosomes:
  karyotype: [ '2', '18' ]
  train: [ '2' ]
  score: [ '18' ]

# Use repository test genomes
generate_variants:
  reference_genome_wildcard: "/cfs/klemming/projects/supr/sllstore2017093/julia_omniCADD/hoglu001/omniCADD/genomeBoar/Wild_Boar_chr{chr}.fa"

gene_annotation:
  source: "augustus"
  predict_genes: true
  augustus:
    species: "human"
    hints: null
    options: "--strand=both --UTR=on --gff3=on"

# Container images used by specific rules
# IMPORTANT: Use Quay.io Biocontainers tags (Docker Hub often misses tags)
# Find tags: conda search -c bioconda augustus (map version/build to tag)
# Verify:    apptainer exec docker://quay.io/biocontainers/augustus:<tag> augustus --version
containers:
  # Use your Docker Hub image built by CI (bundles augustus + snpEff + java)
  augustus: "docker://juliahoglund/augustus:bioconda-3x"
  # Use the same image for SNPEff to keep single-image tooling
  snpeff: "docker://juliahoglund/augustus:bioconda-3x"

annotation:
  variant_annotator: "snpeff"
  snpeff:
    enabled: true
    database:
      name: "wild_boar_custom"
      path: "results/snpeff/data/"
    build:
      config_file: ".tests/snpEff/snpEff.config"
      annotation_format: "gff3"
      # For real runs, keep default build checks enabled
    run:
      options: "-v -noStats"
  grantham_matrix: ".tests/grantham/grantham_matrix.tsv"

stats_report:
  enabled: false

ancestral_sequence:
  source: "none"
