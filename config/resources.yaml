---
# Computational resources for omniCADD pipeline rules
# Only rules that differ from defaults need to be specified
# All others automatically use default_resources

############################
### DEFAULT RESOURCES ######
############################
default_resources:
  threads: 1
  time: "04:00:00"
  mem_mb: 8192
  mem_per_cpu: 8192
  partition: "core"

#######################################################
### RESOURCE-INTENSIVE RULES (override defaults) ######
#######################################################
# Only specify rules that need more resources than defaults
# Format: rule_name: {threads: X, mem_mb: Y, time: "HH:MM:SS"}

##################################
### STEP 1: ANCESTRAL SEQUENCE ###
##################################
maf_ro:
  mem_mb: 49152
  threads: 6
  time: "12:00:00"

maf_df:
  mem_mb: 32768
  threads: 4
  time: "10:00:00"

mark_ancestor:
  mem_mb: 24576
  threads: 3
  time: "08:00:00"

reconstruct_ancestor:
  mem_mb: 49152
  threads: 6
  time: "16:00:00"

fit_phylo_model:
  mem_mb: 32768
  threads: 4
  time: "12:00:00"

###################################
### STEP 2: VARIANT DERIVATION ####
###################################
freq_files:
  mem_mb: 16384  # 16GB for large chromosomes
  threads: 1
  time: "02:00:00"  # 2 hours for large VCF files
  runtime: 120  # Same as time, in minutes - for SLURM executor

gen_derived:
  mem_mb: 16384
  threads: 2
  time: "02:00:00"  # 2 hours
  runtime: 120

snp_filter:
  mem_mb: 8192
  threads: 1
  time: "02:00:00"

merge_by_chr:
  mem_mb: 8192
  threads: 1
  time: "01:00:00"

