# Test configuration: STANDARD (all data available)
# Scenario: Well-annotated species with full resources
# Use this to test workflows with existing GFF, VEP cache, MAF alignments, etc.

containers:
  augustus: "docker://quay.io/biocontainers/augustus:3.5.0--pl5321h9f8466b_5"
  snpeff: "docker://biocontainers/snpeff:v5.1.0_cv1"
  maftools: "docker://juliahoglund/maftools:latest"

###################
### DATA TIER #####
###################
# Test configuration using "standard" tier preset
# 
# TIER OPTIONS:
#   "standard" - GFF annotation, VEP, pre-existing MAF alignment (this config)
#   "limited"  - Augustus prediction, SNPEff, minimap2 alignment building
#   "custom"   - Manual settings (ignores presets)
#
# See docs/DATA_TIERS.md for details
data_tier: "standard"

###################
### SPECIES INFO ##
###################
species_name: "sus_scrofa"
genome_version: "Sscrofa11.1"

chromosomes:
  autosomes: [ '18' ]
  karyotype: [ '18' ]  # Test data only available for chr18
  train: [ '18' ]      # Use chr18 for training in tests
  score: [ '18' ]      # Score chr18 only
  
  naming:
    convention: "numeric"
    include_scaffolds: false
    standardize:
      enabled: false  # Pre-formatted genome
      patterns: []

#######################
### PREPROCESSING #####
#######################
preprocessing:
  reference_genome:
    needs_formatting: false
    needs_filtering: false
    needs_indexing: true
    
  population_vcf:
    needs_processing: false
    chromosome_prefix: "chr"

########################
### GENE ANNOTATION ####
########################
gene_annotation:
  source: "gff"  # Existing annotation available
  
  gff: '.tests/resources/Sus_scrofa.Sscrofa11.1.111.chr18.gff3.gz'  # Test file: chr18 only
  gtf: 'resources/Sus_scrofa.Sscrofa11.1.111.chr.gtf.gz'
  
  predict_genes: false
  ancestral_mode: "alignment"
  augustus:
    enabled: false
    species_model: "human"
    species: "human"
    output_format: "gff3"
    parameters: "--protein=on --codingseq=on --introns=on --start=on --stop=on --cds=on"
    
  convert_gff_to_gtf: false

###########################
### ANCESTRAL SEQUENCE ####
###########################
ancestral_sequence:
  source: "alignment"  # MAF alignments available
  
  alignment:
    enabled: true
    alignments:
      43_mammals.epo:
        path: '.tests/resources/alignment/'  # Test data: minimal chr18 alignment
        type: 'maf.gz'
        clean_maf: true
        ancestral_label: "Ancestor_Pig_Cow"
        # Species order for ancestral extraction (filters to only these species)
        filter_order: "sus_scrofa,Ancestor_Pig_Cow,bos_taurus"
        # Species order for conservation (keeps ALL species, just reorders with reference first)
        # IMPORTANT: List all species from your phylogenetic tree to preserve full tree for GERP
        conservation_species_order: "sus_scrofa,bos_taurus,ovis_aries_rambouillet,camelus_dromedarius,catagonus_wagneri,sus_barbatus,sus_cebifrons,sus_celebensis,sus_verrucosus,babyrousa_babyrussa,phacochoerus_africanus,potamochoerus_porcus,tayassu_pecari,pecari_tajacu,hippopotamus_amphibius,cervus_hanglu_yarkandensis,bos_indicus_hybrid,bos_grunniens,bos_mutus,bison_bison_bison,bubalus_bubalis,capra_hircus,ovis_canadensis,ammotragus_lervia,pantholops_hodgsonii,antilocapra_americana,giraffa_tippelskirchi,vicugna_pacos,equus_caballus,equus_asinus,ceratotherium_simum_simum,rhinolophus_ferrumequinum,canis_lupus_familiaris,felis_catus,tursiops_truncatus,orcinus_orca,physeter_catodon,balaenoptera_musculus,loxodonta_africana,homo_sapiens,mus_musculus"
        exclude_patterns: [ "scaffold", "epo.Y" ]
        name_species_interest: "sus_scrofa"
        chrom_prefix: "chr"
        
  reconstruct:
    enabled: false
    method: "align_to_reference"
    input_fasta: "resources/ancestral/Ancestor.fasta"
    tools:
      bbmap:
        read_length: 150
        quality: 40
      bwa:
        threads: 32
        scoring: "-B 3 -O 4,4"
      samtools:
        min_quality: 2
      htsbox:
        min_quality: 30
        min_base_quality: 30
        min_length: 35
    format_gaps: true
    
  outgroup:
    enabled: false
    species: "bos_taurus"

mark_ancestor:
  ancestral_alignment: "43_mammals.epo"
  name_ancestor: 'Ancestor_Pig_Cow'
  sp1_tree_ab: 'Sscr'
  sp2_tree_ab: 'Btau'
  reference_genome: '.tests/resources/genome/Sus_scrofa_ref.fa'  # Test data

###########################
### VARIANT GENERATION ####
###########################
generate_variants:
  reference_genome_wildcard: ".tests/resources/genome/Sus_scrofa_ref_18.fa"  # Test: chr18 only
  population_vcf: ".tests/resources/population/chr{chr}.vcf.gz"  # Test data
  
  derive:
    frequency_threshold: 0.9
    
  simulate:
    overestimation_factor: 5

############################
### VARIANT ANNOTATION #####
############################
annotation:
  variant_annotator: "vep"  # VEP cache available
  
  vep:
    enabled: true
    cache:
      directory: '$VEP_CACHE'
      should_install: false
      install_params: "--CACHE_VERSION 111 -s sus_scrofa -y Sscrofa11.1"
    options: "--everything --fork 2"
    
  snpeff:
    enabled: false
    database:
      exists: false
      name: "sus_scrofa_custom"
      path: "resources/snpEff/data/"
    build:
      annotation_format: "gff3"
      genome_fasta: "resources/genome/Sus_scrofa_ref.fa"
      config_file: "resources/snpEff/snpEff.config"
    run:
      options: "-v -stats"
      output_format: "vcf"
      
  sift:
    enabled: false
    database:
      exists: false
      parent_dir: "resources/SIFT4G/"
    
  conservation:
    gerp:
      enabled: true
      alignment: '43_mammals.epo'
      n_chunks: 30
      tree: 'resources/tree_43_mammals.nwk'
      
    phast:
      enabled: true
      phastCons: true
      phyloP: true
      tree: '(camelus_dromedarius,(catagonus_wagneri,sus_scrofa),(bos_taurus,ovis_aries_rambouillet))'
      tree_species: "sus_scrofa|camelus_dromedarius|catagonus_wagneri|bos_taurus|ovis_aries_rambouillet"
      train_precision: "HIGH"
      phastCons_params: "--target-coverage 0.3 --expected-length 45 --rho 0.3"
      phyloP_params: "--method=LRT --mode=CONACC"
      
  grantham_matrix: "resources/grantham_matrix/grantham_table.tsv"

annotation_config:
  processing: "config/annot_processing_config.tsv"
  interactions: "config/annot_combination_config.tsv"

########################
### SUMMARY REPORT #####
########################
stats_report:
  enabled: true
  annotation: true
  prefix: '.tests/resources/Sus_scrofa.Sscrofa11.1.111.chr'
  tree: '.tests/resources/tree_43_mammals.nwk'  # Test data
  ingroup: 'sus scrofa'
  outgroup: 'bos taurus'

######################
### MODEL TRAINING ###
######################
model:
  n_folds: 10
  test_params:
    c: [0.1, 1.0, 10.0]
    max_iter: [100]
  final_params:
    c: 10.0
    max_iter: 100
  column_subsets:
    All: "SPECIAL KEY, uses all columns"

#########################
### PARALLELIZATION #####
#########################
parallelization:
  alignment_positions_per_file: 100000
  whole_genome_positions_per_file: 500000
  alignment_chunks: 30
  memory: 60000

dataset_memory_mb: 60000

###########################
### WORKFLOW PROFILES #####
###########################
# Preset configurations applied when data_tier is set
profiles:
  standard:
    gene_annotation:
      source: "gff"
      predict_genes: false
    annotation:
      variant_annotator: "vep"
    ancestral_sequence:
      source: "alignment"
    preprocessing:
      reference_genome:
        needs_formatting: false
        
  limited:
    gene_annotation:
      source: "augustus"
      predict_genes: true
    annotation:
      variant_annotator: "snpeff"
    ancestral_sequence:
      source: "build_alignment"
    preprocessing:
      reference_genome:
        needs_formatting: true
        needs_filtering: true
