# Test configuration: LIMITED (limited data available)
# Scenario: Poorly-annotated species requiring gene prediction, reconstruction, etc.
# Use this to test workflows that build databases, predict genes, reconstruct ancestors

containers:
  augustus: "docker://quay.io/biocontainers/augustus:3.5.0--pl5321h9f8466b_5"
  snpeff: "docker://biocontainers/snpeff:v5.1.0_cv1"
  maftools: "docker://juliahoglund/maftools:latest"

###################
### DATA TIER #####
###################
# Test configuration using "limited" tier preset
# 
# TIER OPTIONS:
#   "standard" - GFF annotation, VEP, pre-existing MAF alignment
#   "limited"  - Augustus prediction, SNPEff, minimap2 alignment building (this config)
#   "custom"   - Manual settings (ignores presets)
#
# See docs/DATA_TIERS.md for details
data_tier: "limited"

###################
### SPECIES INFO ##
###################
species_name: "sus_scrofa"
genome_version: "Sscrofa11.1"

chromosomes:
  autosomes: [ '18' ]
  karyotype: [ '18' ]  # Test data only available for chr18
  train: [ '18' ]      # Use chr18 for training in tests
  score: [ '18' ]      # Score chr18 only
  
  naming:
    convention: "numeric"
    include_scaffolds: false
    standardize:
      enabled: true  # Need to standardize chromosome names
      patterns:
        - from: "chr_"
          to: ""
        - from: "_pilon"
          to: ""
        - from: "chromosome_"
          to: ""

#######################
### PREPROCESSING #####
#######################
preprocessing:
  reference_genome:
    needs_formatting: true   # Linearize FASTA
    needs_filtering: true    # Remove scaffolds
    needs_indexing: true
    
  population_vcf:
    needs_processing: true
    chromosome_prefix: "chr"

########################
### GENE ANNOTATION ####
########################
gene_annotation:
  source: "augustus"  # Must predict genes (no existing annotation)
  
  gff: '.tests/resources/Sus_scrofa.Sscrofa11.1.111.chr18.gff3.gz'
  gtf: ''
  
  predict_genes: true
  ancestral_mode: "alignment"
  augustus:
    enabled: true
    species_model: "human"
    species: "human"
    output_format: "gff3"
    parameters: "--protein=on --codingseq=on --introns=on --start=on --stop=on --cds=on"
    
  convert_gff_to_gtf: false

###########################
### ANCESTRAL SEQUENCE ####
###########################
ancestral_sequence:
  source: "alignment"  # Test uses pre-existing MAF (build_alignment not testable via dry-run)
  
  alignment:
    enabled: true
    alignments:
      43_mammals.epo:
        path: '.tests/resources/alignment/'
        type: 'maf.gz'
        clean_maf: true
        ancestral_label: "Ancestor_Pig_Cow"
        # Species order for ancestral extraction (filters to only these species)
        filter_order: "sus_scrofa,Ancestor_Pig_Cow,bos_taurus"
        # Note: conservation_species_order not needed when alignment.enabled = false
        exclude_patterns: [ "scaffold", "epo.Y" ]
        name_species_interest: "sus_scrofa"
        chrom_prefix: "chr"
  
  # Build multi-species alignment with minimap2 for conservation
  build_alignment:
    enabled: true
    method: "minimap2"
    
    # Download relevant EPO 43 mammals species
    download_genomes:
      enabled: true
      source: "ensembl"
      # Select phylogenetically relevant species from EPO 43 mammals
      species_list:
        - name: "bos_taurus"
          ensembl_name: "Bos_taurus"
          version: "ARS-UCD1.2"
        - name: "ovis_aries_rambouillet"
          ensembl_name: "Ovis_aries_rambouillet"
          version: "Oar_rambouillet_v1.0"
        - name: "camelus_dromedarius"
          ensembl_name: "Camelus_dromedarius"
          version: "CamDro2"
        - name: "catagonus_wagneri"
          ensembl_name: "Catagonus_wagneri"
          version: "CatWag_v2_BIUU_UU"
        - name: "equus_caballus"
          ensembl_name: "Equus_caballus"
          version: "EquCab3.0"
      local_genomes: []
    
    # Minimap2 parameters for genome alignment
    minimap2:
      preset: "asm5"  # For closely related species
      threads: 32
      params: "-x asm5 --cs -t 32"
      output_format: "paf"
      
    # Convert alignments to MAF
    convert_to_maf:
      enabled: true
      tool: "paf2maf"
      reference_species: "sus_scrofa"
      
    # Reconstruct ancestral sequences from the built alignment using phast
    phast_reconstruction:
      enabled: true
      method: "phast"
      tree: "(camelus_dromedarius,(catagonus_wagneri,sus_scrofa),(bos_taurus,ovis_aries_rambouillet))"
      outgroup: "equus_caballus"
      
    # Use this built alignment for GERP, phastCons, phyloP
    use_for_conservation: true
        
  # Alternative method: Simple reconstruction from FASTA (only used when source: "simple_reconstruction")
  simple_reconstruction:
    method: "align_to_reference"
    input_fasta: "resources/ancestral/Ancestor.fasta"
    tools:
      bbmap:
        read_length: 150
        quality: 40
      bwa:
        threads: 32
        scoring: "-B 3 -O 4,4"
      samtools:
        min_quality: 2
      htsbox:
        min_quality: 30
        min_base_quality: 30
        min_length: 35
    format_gaps: true
    
  outgroup:
    enabled: false
    species: "bos_taurus"

mark_ancestor:
  ancestral_alignment: "43_mammals.epo"
  name_ancestor: 'Ancestor_Pig_Cow'
  sp1_tree_ab: 'Sscr'
  sp2_tree_ab: 'Btau'
  reference_genome: '.tests/resources/genome/Sus_scrofa_ref.fa'

###########################
### VARIANT GENERATION ####
###########################
generate_variants:
  reference_genome_wildcard: ".tests/resources/genome/Sus_scrofa_ref_{chr}.fa"  # Test data
  population_vcf: ".tests/resources/population/chr{chr}.vcf.gz"  # Test data
  
  derive:
    frequency_threshold: 0.9
    
  simulate:
    overestimation_factor: 5

############################
### VARIANT ANNOTATION #####
############################
annotation:
  variant_annotator: "snpeff"  # Must build database (no VEP cache)
  
  vep:
    enabled: false
    cache:
      directory: '$VEP_CACHE'
      should_install: false
      install_params: "--CACHE_VERSION 111 -s sus_scrofa -y Sscrofa11.1"
    options: "--everything --fork 2"
    
  snpeff:
    enabled: true
    database:
      exists: false  # Build database from scratch
      name: "sus_scrofa_custom"
      path: "resources/snpEff/data/"
    build:
      annotation_format: "gff3"
      genome_fasta: ".tests/resources/genome/Sus_scrofa_ref.fa"
      config_file: "resources/snpEff/snpEff.config"
    run:
      options: "-v -stats"
      output_format: "vcf"
      
  sift:
    enabled: false
    database:
      exists: false
      parent_dir: "resources/SIFT4G/"
    
  conservation:
    gerp:
      enabled: true  # Use built multi-species alignment
      alignment: 'build_alignment'  # References the minimap2-built alignment
      n_chunks: 30
      tree: 'resources/tree_custom.nwk'  # Tree matching downloaded species
      
    phast:
      enabled: true
      phastCons: true
      phyloP: true
      # Tree matching the species downloaded and aligned with minimap2
      tree: '(camelus_dromedarius,(catagonus_wagneri,sus_scrofa),(bos_taurus,ovis_aries_rambouillet))'
      tree_species: "sus_scrofa|camelus_dromedarius|catagonus_wagneri|bos_taurus|ovis_aries_rambouillet"
      train_precision: "MEDIUM"  # Medium precision for custom alignment
      phastCons_params: "--target-coverage 0.3 --expected-length 45 --rho 0.3"
      phyloP_params: "--method=LRT --mode=CONACC"
      
  grantham_matrix: "resources/grantham_matrix/grantham_table.tsv"

annotation_config:
  processing: "config/annot_processing_config.tsv"
  interactions: "config/annot_combination_config.tsv"

########################
### SUMMARY REPORT #####
########################
stats_report:
  enabled: true
  annotation: false
  prefix: ''
  tree: '.tests/resources/tree_43_mammals.nwk'  # Test data
  ingroup: 'sus scrofa'
  outgroup: 'bos taurus'

######################
### MODEL TRAINING ###
######################
model:
  n_folds: 5  # Fewer folds for faster testing
  test_params:
    c: [1.0]  # Single parameter for faster testing
    max_iter: [100]
  final_params:
    c: 1.0
    max_iter: 100
  column_subsets:
    All: "SPECIAL KEY, uses all columns"

#########################
### PARALLELIZATION #####
#########################
parallelization:
  alignment_positions_per_file: 100000
  whole_genome_positions_per_file: 500000
  alignment_chunks: 30
  memory: 60000

dataset_memory_mb: 60000


###########################
### WORKFLOW PROFILES #####
###########################
# Preset configurations applied when data_tier is set
profiles:
  standard:
    gene_annotation:
      source: "gff"
      predict_genes: false
    annotation:
      variant_annotator: "vep"
    ancestral_sequence:
      source: "alignment"
    preprocessing:
      reference_genome:
        needs_formatting: false
        
  limited:
    gene_annotation:
      source: "augustus"
      predict_genes: true
    annotation:
      variant_annotator: "snpeff"
    ancestral_sequence:
      source: "alignment"  # Test: use pre-existing MAF (build_alignment not testable via dry-run)
    preprocessing:
      reference_genome:
        needs_formatting: true
        needs_filtering: true
